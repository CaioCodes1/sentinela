[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# A URL **não** fica aqui. `alembic/env.py` a lê de `DATABASE_URL`, pelo mesmo
# objeto de configuração da aplicação. Deixar a string de conexão neste arquivo
# significaria versionar credencial de banco — e este é o arquivo que todo
# tutorial de Alembic manda preencher.
sqlalchemy.url =

# Nome do arquivo de migration: data + descrição, para a pasta ficar legível em
# ordem cronológica em vez de uma lista de hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Sem post_write_hooks: o hook de formatação do ruff depende de um
# entrypoint `console_scripts` que a instalação por wheel nem sempre
# registra, e a falha dele **aborta a geração da migration**. A formatação
# entra no passo de lint (`scripts/verificar.*`), onde falhar é inofensivo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
