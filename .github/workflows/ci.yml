name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permissões mínimas por padrão. Sem esta declaração, o GITHUB_TOKEN vem com
# escopo de escrita em vários recursos — e qualquer ação de terceiro no
# pipeline passa a ter esse poder.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint, formato e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy app

  testes:
    name: Testes (unitários + integração)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinela
          POSTGRES_PASSWORD: sentinela
          POSTGRES_DB: sentinela_test
        ports: ["5432:5432"]
        # Sem o healthcheck, os passos começam antes de o banco aceitar conexão
        # e a suíte falha de forma intermitente — o tipo de vermelho que o time
        # aprende a reexecutar em vez de investigar.
        options: >-
          --health-cmd "pg_isready -U sentinela -d sentinela_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinela:sentinela@localhost:5432/sentinela_test
      DATABASE_URL: postgresql+psycopg://sentinela:sentinela@localhost:5432/sentinela_test
      JWT_SECRET: segredo-de-ci-com-tamanho-mais-que-suficiente-0123456789
      NOTIFIER_API_KEY: chave-de-ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Suíte completa
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      # Portão de deriva: o schema do banco tem de corresponder ao modelo. Uma
      # coluna acrescentada em `tables.py` sem migration reprova aqui, em vez de
      # aparecer como erro em produção.
      - name: Deriva entre modelo e migrations
        run: alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage.xml

  seguranca:
    name: Varredura de segurança
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -e ".[dev]" pip-audit

      # Vulnerabilidades conhecidas nas dependências.
      #
      # `continue-on-error` de propósito: uma CVE publicada hoje numa
      # dependência transitiva reprovaria o build de quem não mudou nada, e o
      # reflexo seria desativar o passo. Ele informa; o bloqueio fica nos
      # portões determinísticos acima.
      - name: Dependências vulneráveis
        continue-on-error: true
        run: pip-audit --strict --desc

      # O ruff já roda as regras do Bandit (prefixo `S`) no job de qualidade.
      # Este passo é o portão explícito, separado para aparecer com nome
      # próprio no relatório.
      - name: Regras de segurança de código
        run: ruff check --select S --output-format=github .

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [qualidade, testes]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: sentinela-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Duas etapas separadas, e isso é deliberado.
      #
      # A action do Trivy sobrescreve `TRIVY_SEVERITY` quando o formato é SARIF
      # ("Building SARIF report with all severities" aparece no log), e o
      # `exit-code` passa a disparar em qualquer achado — inclusive LOW. O
      # resultado é um build reprovando por CVE medium sem nenhuma HIGH, e a
      # reação natural (baixar o severity) transforma o portão em enfeite.
      #
      # Etapa 1: gera o SARIF, sem bloquear.
      # A referência é o SHA do commit, com a versão no comentário. Duas razões:
      # a tag `0.28.0` **sem o `v`** não existe mais no repositório da action e
      # fazia o job inteiro falhar em "Set up job", antes de qualquer passo; e
      # uma tag pode ser reapontada para outro commit, enquanto o SHA não.
      - name: Relatório de vulnerabilidades (informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinela-api:ci
          format: sarif
          output: trivy.sarif

      # Etapa 2: o portão de verdade.
      - name: Portão — HIGH e CRITICAL com correção disponível
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinela-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
